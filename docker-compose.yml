services:
  postgres:
    image: postgres:16-alpine
    container_name: invento-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: invento_dev
      POSTGRES_USER: invento
      POSTGRES_PASSWORD: invento
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U invento -d invento_dev']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    working_dir: /app
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: invento-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      APP_API_PREFIX: api
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOAD_STORAGE_PATH: /app/uploads
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PREFIX: ${S3_PREFIX:-invento}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      DATABASE_URL: postgresql://invento:invento@postgres:5432/invento_dev?schema=public
    ports:
      - '3000:3000'
    volumes:
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - workspace_node_modules:/app/node_modules
      - upload_data:/app/uploads
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared
      - backend_node_modules:/app/apps/api/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
    command: sh -c "npm ci --workspace @invento/api --workspace @invento/shared --include=dev && npm --workspace @invento/shared run build && npm --workspace @invento/api run prisma:generate && npm --workspace @invento/api run prisma:migrate:deploy && npm --workspace @invento/api run build && npm --workspace @invento/api run start:prod"

volumes:
  workspace_node_modules:
  redis_data:
  upload_data:
  postgres_data:
  backend_node_modules:
  shared_node_modules:
